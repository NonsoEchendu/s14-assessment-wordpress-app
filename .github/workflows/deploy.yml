name: Deploy wordpress app to server

on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with: 
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USERNAME }}
            password: ${{ secrets.SERVER_PASSWORD }}
            script: |
              cd ~/s14-assessment-wordpress-app

              #pull the latest changes
              git checkout main
              git pull origin main

              #pull latest image versions from docker-compose file
              docker compose pull

              docker compose stop

              #stop and remove any existing and running containers and networks
              docker compose down --remove-orphans

              sleep 2

              # restart the services using the updated docker-compose.yml
              docker compose up -d