name: Rollback

on:
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'Git tag (from a successful deployment) to roll back to'
        required: true
        type: string

jobs:
  rollback_app:
    name: Rollback to ${{ github.event.inputs.rollback_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Perform rollback on server
        id: rollback_step
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ROLLBACK_TAG=${{ github.event.inputs.rollback_tag }}

            echo "Attempting to rollback to tag: $ROLLBACK_TAG"

            cd ~/s14-assessment-wordpress-app
            
            # Ensures the server's local git clone has all tags from the remote
            git fetch --all --tags

            # switch files in current dir to match state of specified tag
            git checkout $ROLLBACK_TAG || { echo "Error: Tag $ROLLBACK_TAG not found on server's clone. Ensure the tag was pushed and fetched." ; exit 1; }

            echo "Running docker compose pull..."
            docker compose pull || { echo "Error: docker compose pull failed." ; exit 1; }

            echo "Stopping current containers..."
            docker compose down --remove-orphans || { echo "Error: docker compose down failed." ; exit 1; }

            echo "Starting containers from tag: $ROLLBACK_TAG"
            docker compose up -d || { echo "Error: docker compose up failed." ; exit 1; }

            echo "Rollback completed successfully"

      - name: Send Slack notification on rollback success
        if: steps.rollback_step.outcome == 'success'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "↩️ Rollback Successful\nProject: `${{ github.repository }}`\nTag: `${{ github.event.inputs.rollback_tag }}`\nTriggered by: `${{ github.actor }}`\nWorkflow Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack notification on rollback failure
        if: steps.rollback_step.outcome == 'failure'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Rollback Failed\nProject: `${{ github.repository }}`\nAttempted Tag: `${{ github.event.inputs.rollback_tag }}`\nTriggered by: `${{ github.actor }}`\nWorkflow Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\nError: See workflow run logs for details."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}