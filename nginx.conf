
# --- Configuration for your-website.com (WordPress) ---
server {
    listen 443 ssl; # managed by Certbot

    server_name your-website.com www.your-website.com;

    ssl_certificate /etc/letsencrypt/live/your-website.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/your-website.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location / {
        proxy_pass http://127.0.0.1:8000; # Proxy to your WordPress Docker container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Block access to sensitive files
    location ~ /\.ht {
        deny all;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt { log_not_found off; access_log off; allow all; }

    # Optional: uncomment for browser caching of static assets
    #location ~* \.(css|gif|ico|jpeg|jpg|js|png)$ {
    #    expires max;
    #    log_not_found off;
    #}
}

# HTTP redirect server block for your-website.com
server {
    if ($host = www.your-website.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = your-website.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80; # Keep IPv6 listener for HTTP redirects

    server_name your-website.com www.your-website.com;
    return 404; # managed by Certbot - Returns 404 if not redirected

}

